---
openapi: "3.0.3"
info:
  title: "SERVICE PROVIDER MANAGEMENT REST API"
  description: "API for managing service provider"
  version: "0.0.1-SNAPSHOT"
paths:
  /service-provider:
    post:
      tags:
      - "ServiceProvider"
      summary: "Become Service Provider"
      description: "Become Service Provider"
      operationId: "becomeServiceProvider"
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProviderRegister"
      responses:
        "201":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponse"
        "404":
          description: "SERVICE_PROVIDER_404_001"
        "409":
          description: "SERVICE-PROVIDER_409_001| SERVICE-PROVIDER_409_002"
    get:
      tags:
      - "ServiceProvider"
      summary: "Get All Service Provider"
      description: "Get All Service Provider"
      operationId: "getAllServiceProvider"
      security:
      - bearerAuth: []
      - oAuth:
        - "service-provider:read:all"
      parameters:
      - name: "status"
        in: "query"
        required: false
        schema:
          $ref: "#/components/schemas/ServiceProviderStatus"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
      - name: "limit"
        in: "query"
        required: true
        description: "represents the number of service provider to fetch per page."
        schema:
          type: "integer"
          minimum: "10"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderPaginate"
  /service-provider/search:
    get:
      tags:
      - "ServiceProvider"
      summary: "Search providers with location priority"
      description: "Search providers with location priority (Quarter > District >\
        \ City)"
      operationId: "searchServiceProviders"
      parameters:
      - name: "serviceTypeId"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "cityId"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "districtId"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "quarterId"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
      - name: "limit"
        in: "query"
        required: true
        schema:
          type: "integer"
          minimum: "10"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderPaginate"
  /service-provider/{serviceProviderId}:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get Service Provider By Id"
      description: "Get Service Provider By Id"
      operationId: "GetServiceProviderById"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProvider"
        "404":
          description: "SERVICE_PROVIDER_404_002"
  /service-provider/{serviceProviderId}/approve:
    put:
      tags:
      - "ServiceProvider"
      summary: "Approve Service Provider Request"
      description: "Approve Service Provider Request"
      operationId: "ApproveServiceProvider"
      security:
      - oAuth:
        - "service-provider:approve"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE_PROVIDER_404_002"
  /service-provider/add-service:
    put:
      tags:
      - "ServiceProvider"
      summary: "Add new service to provide"
      description: "Add new service to provide"
      operationId: "addNewService"
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceType"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE_PROVIDER_404_002"
  /service-provider/{serviceProviderId}/reject:
    put:
      tags:
      - "ServiceProvider"
      summary: "Reject Service Provider Request"
      description: "Reject Service Provider Request"
      operationId: "RejectServiceProvider"
      security:
      - oAuth:
        - "service-provider:reject"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE_PROVIDER_404_002"
  /service-catalog:
    get:
      tags:
      - "ServiceType"
      summary: "Get the complete service catalog grouped by categories"
      description: "Get the complete service catalog grouped by categories"
      operationId: "getServiceCatalog"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/ServiceCatalogItem"
components:
  schemas:
    ServiceProviderRegister:
      required:
      - "phoneNumber"
      - "city"
      - "district"
      - "quarter"
      - "serviceType"
      type: "object"
      properties:
        city:
          type: "string"
          format: "uuid"
        district:
          type: "string"
          format: "uuid"
        quarter:
          type: "string"
          format: "uuid"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        serviceType:
          $ref: "#/components/schemas/ServiceType"
    ServiceProviderPaginate:
      type: "object"
      required:
      - "serviceProvider"
      - "count"
      properties:
        serviceProvider:
          type: "array"
          items:
            $ref: "#/components/schemas/ServiceProvider"
        count:
          type: "integer"
          format: "int64"
    ServiceProvider:
      required:
      - "id"
      - "userId"
      - "city"
      - "district"
      - "quarter"
      - "serviceProviderStatus"
      - "phoneNumber"
      - "createdAt"
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        city:
          type: "string"
          format: "uuid"
        district:
          type: "string"
          format: "uuid"
        quarter:
          type: "string"
          format: "uuid"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        serviceProviderStatus:
          $ref: "#/components/schemas/ServiceProviderStatus"
        userServices:
          type: "array"
          items:
            $ref: "#/components/schemas/UserService"
    UserService:
      type: "object"
      required:
      - "serviceProviderId"
      - "serviceTypeId"
      - "createdAt"
      properties:
        serviceProviderId:
          type: "string"
          format: "uuid"
        document:
          type: "string"
          format: "uuid"
        createdAt:
          type: "string"
          format: "date-time"
        serviceType:
          $ref: "#/components/schemas/ServiceType"
    PhoneNumber:
      type: "object"
      required:
      - "countryCode"
      - "number"
      properties:
        countryCode:
          type: "string"
        number:
          type: "string"
    ServiceType:
      type: "object"
      required:
      - "id"
      - "yearOfExperience"
      - "document"
      properties:
        id:
          type: "string"
          format: "uuid"
        yearOfExperience:
          type: "integer"
        document:
          type: "string"
          format: "uuid"
    ServiceProviderStatus:
      type: "string"
      enum:
      - "PENDING"
      - "APPROVED"
      - "REJECTED"
    ServiceCatalogItem:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        category:
          type: "string"
    CreationResponse:
      type: "object"
      required:
      - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
