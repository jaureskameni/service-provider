---
openapi: "3.0.3"
info:
  title: "SERVICE PROVIDER MANAGEMENT REST API"
  description: "API for managing service provider"
  version: "0.0.1-SNAPSHOT"
paths:
  /service-provider:
    post:
      tags:
      - "ServiceProvider"
      summary: "Become Service Provider"
      description: "Become Service Provider"
      operationId: "becomeServiceProvider"
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceProviderRegister"
      responses:
        "201":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponse"
        "404":
          description: "SERVICE-PROVIDER_404_001 | SERVICE-PROVIDER_404_003"
        "409":
          description: "SERVICE_PROVIDER-409-001 | SERVICE_PROVIDER-409-002 | SERVICE_PROVIDER-409-005"
        "400":
          description: "SERVICE_PROVIDER-400-003 | SERVICE_PROVIDER-400-004"
    get:
      tags:
      - "ServiceProvider"
      summary: "Get All Service Provider"
      description: "Get All Service Provider"
      operationId: "getAllServiceProvider"
      security:
      - oAuth:
        - "service-provider:read:all"
      parameters:
      - name: "status"
        in: "query"
        required: false
        schema:
          $ref: "#/components/schemas/ServiceProviderStatus"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
      - name: "limit"
        in: "query"
        required: true
        description: "represents the number of service provider to fetch per page."
        schema:
          type: "integer"
          minimum: "10"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderPaginate"
        "400":
          description: "SERVICE_PROVIDER-400-001"
  /service-provider/search:
    get:
      tags:
      - "ServiceProvider"
      summary: "Search providers with location priority"
      description: "Search providers with location priority (Quarter > District >\
        \ City). Phone number and email are omitted from search results; they are\
        \ available on the provider detail only to an authenticated client of that\
        \ provider."
      operationId: "searchServiceProviders"
      parameters:
      - name: "serviceTypeId"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "cityId"
        in: "query"
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "districtId"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "quarterId"
        in: "query"
        required: false
        schema:
          type: "string"
          format: "uuid"
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
      - name: "limit"
        in: "query"
        required: true
        schema:
          type: "integer"
          minimum: "10"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderPaginate"
        "400":
          description: "SERVICE_PROVIDER-400-001"
  /service-provider/{serviceProviderId}:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get Service Provider By Id"
      description: "Returns the public profile without the provider's phone number\
        \ or the user's email. Public endpoints do not return contact details."
      operationId: "GetServiceProviderById"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderPublicProfile"
        "404":
          description: "SERVICE-PROVIDER_404_002"
  /service-provider/{serviceProviderId}/approve:
    put:
      tags:
      - "ServiceProvider"
      summary: "Approve Service Provider Request"
      description: "Approve Service Provider Request"
      operationId: "ApproveServiceProvider"
      security:
      - oAuth:
        - "service-provider:approve"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE-PROVIDER_404_002"
        "409":
          description: "SERVICE_PROVIDER-409-004"
  /service-provider/{serviceProviderId}/reject:
    put:
      tags:
      - "ServiceProvider"
      summary: "Reject Service Provider Request"
      description: "Reject Service Provider Request"
      operationId: "RejectServiceProvider"
      security:
      - oAuth:
        - "service-provider:reject"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionReason"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE-PROVIDER_404_002"
        "409":
          description: "SERVICE_PROVIDER-409-004"
  /me/service-provider:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get my service provider application"
      operationId: "getMyServiceProvider"
      security:
      - bearerAuth: []
      responses:
        "200":
          description: "Current workflow state (CNI references are never returned)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyServiceProvider"
        "404":
          description: "No service provider exists for the authenticated user."
    put:
      tags:
      - "ServiceProvider"
      summary: "Update a rejected service provider application"
      description: "Updates the rejected provider profile and identity documents,\
        \ then returns the same ServiceProvider and IdentityVerification to PENDING.\
        \ User account details remain managed by UAM."
      operationId: "updateRejectedServiceProvider"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResubmitServiceProviderApplication"
      responses:
        "204":
          description: "Application resubmitted"
        "404":
          description: "SERVICE-PROVIDER_404_001 if the mirrored user is missing;\
            \ SERVICE-PROVIDER_404_002 if the provider is missing."
        "409":
          description: "SERVICE_PROVIDER-409-002 | SERVICE_PROVIDER-409-004 | SERVICE_PROVIDER-409-005"
        "400":
          description: "SERVICE_PROVIDER-400-003 | SERVICE_PROVIDER-400-005"
  /me/service-provider/profile:
    put:
      tags:
      - "ServiceProvider"
      summary: "Update an approved service provider profile"
      description: "Updates approved profile fields without changing IdentityVerification.\
        \ A changed profile photo remains pending admin review. User identity information\
        \ is managed separately by UAM."
      operationId: "updateApprovedServiceProvider"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApprovedServiceProviderProfile"
      responses:
        "204":
          description: "Profile updated"
        "404":
          description: "SERVICE-PROVIDER_404_001"
        "409":
          description: "SERVICE_PROVIDER-409-002 | SERVICE_PROVIDER-409-004 | SERVICE_PROVIDER-409-005"
        "400":
          description: "SERVICE_PROVIDER-400-003"
  /me/service-provider/identity:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get my rejected service provider identity documents"
      description: "Returns CNI and profile photo references only while identity verification\
        \ is REJECTED."
      operationId: "MyServiceProviderIdentity"
      security:
      - bearerAuth: []
      responses:
        "200":
          description: "Rejected identity documents for the authenticated provider."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedServiceProviderIdentity"
        "404":
          description: "No service provider exists for the authenticated user."
        "409":
          description: "SERVICE_PROVIDER-409-004 when identity verification is not\
            \ REJECTED."
  /service-provider/{serviceProviderId}/verification:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get service provider identity verification details"
      description: "Returns the provider view and private identity verification data.\
        \ Identity verification data is omitted when the provider application is APPROVED."
      operationId: "getServiceProviderVerification"
      security:
      - oAuth:
        - "service-provider:verify"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Service provider verification details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderVerification"
        "404":
          description: "SERVICE-PROVIDER_404_002"
  /service-provider/profile-image-reviews:
    get:
      tags:
      - "ServiceProvider"
      summary: "List profile images awaiting admin review"
      description: "Returns a lightweight provider/review summary only. Use the profile-image-review\
        \ detail endpoint for services and private identity verification data."
      operationId: "getProfileImageReviews"
      security:
      - oAuth:
        - "service-provider:read:all"
      parameters:
      - name: "page"
        in: "query"
        schema:
          type: "integer"
          minimum: 0
          default: 0
      - name: "limit"
        in: "query"
        schema:
          type: "integer"
          minimum: 10
          default: 20
      responses:
        "200":
          description: "Pending profile image reviews, including totalElements for\
            \ the admin counter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImageReviewPage"
        "400":
          description: "SERVICE_PROVIDER-400-001"
  /service-provider/{serviceProviderId}/profile-image-review:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get complete private profile photo review details (admin only)"
      description: "Returns provider profile data, current and pending profile photos,\
        \ and private CNI media references for manual admin review. CNI data is never\
        \ returned by public or provider self-service endpoints."
      operationId: "getProfileImageReview"
      security:
      - oAuth:
        - "service-provider:read:all"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Profile image review data with private identity documents."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderProfileImageReview"
        "404":
          description: "SERVICE-PROVIDER_404_002"
        "409":
          description: "SERVICE_PROVIDER-409-004: service provider is not awaiting\
            \ photo review."
  /service-provider/{serviceProviderId}/profile-image/approve:
    put:
      tags:
      - "ServiceProvider"
      operationId: "approveProfileImage"
      security:
      - oAuth:
        - "service-provider:approve"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Approved"
        "404":
          description: "SERVICE-PROVIDER_404_002"
        "409":
          description: "SERVICE_PROVIDER-409-004: no pending photo review or invalid\
            \ status."
  /service-provider/{serviceProviderId}/profile-image/reject:
    put:
      tags:
      - "ServiceProvider"
      operationId: "rejectProfileImage"
      security:
      - oAuth:
        - "service-provider:reject"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectionReason"
      responses:
        "204":
          description: "Rejected; current public photo remains active."
        "404":
          description: "SERVICE-PROVIDER_404_002"
        "409":
          description: "SERVICE_PROVIDER-409-004: no pending photo review or invalid\
            \ status."
  /service-provider/portfolio:
    post:
      tags:
      - "ServiceProvider"
      summary: "Add Provider's Portfolio"
      description: "Add Provider's Portfolio"
      operationId: "addPortfolioItem"
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioItemRequest"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE-PROVIDER_404_002"
        "409":
          description: "SERVICE_PROVIDER-409-004"
    get:
      tags:
      - "ServiceProvider"
      summary: "Get All Provider's Portfolio"
      description: "Get All Provider's Portfolio"
      operationId: "getAllMyPortfolioItem"
      security:
      - bearerAuth: []
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PortfolioItem"
  /service-provider/{serviceProviderId}/portfolio:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get provider portfolio"
      description: "Retrieve all portfolio items of the specified service provider."
      operationId: "getProviderPortfolio"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PortfolioItem"
  /service-provider/portfolio/{portfolioId}:
    put:
      tags:
      - "ServiceProvider"
      summary: "Update a portfolio item"
      operationId: "updatePortfolioItem"
      security:
      - bearerAuth: []
      parameters:
      - name: "portfolioId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioItemRequest"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE-PROVIDER_404_002 | SERVICE-PROVIDER_404_005"
        "409":
          description: "SERVICE_PROVIDER-409-004"
    delete:
      tags:
      - "ServiceProvider"
      summary: "Delete a portfolio item"
      operationId: "deletePortfolioItem"
      security:
      - bearerAuth: []
      parameters:
      - name: "portfolioId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "404":
          description: "SERVICE-PROVIDER_404_002 | SERVICE-PROVIDER_404_005"
        "409":
          description: "SERVICE_PROVIDER-409-004"
  /service-provider/services:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get my services"
      operationId: "getMyServices"
      security:
      - bearerAuth: []
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserService"
    post:
      tags:
      - "ServiceProvider"
      summary: "Add a service to provide"
      operationId: "addNewService"
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderService"
      responses:
        "201":
          description: "Successful operation"
        "404":
          description: "SERVICE-PROVIDER_404_002 | SERVICE-PROVIDER_404_003"
        "400":
          description: "SERVICE_PROVIDER-400-004"
        "409":
          description: "SERVICE_PROVIDER-409-003"
  /service-provider/services/{serviceTypeId}:
    delete:
      tags:
      - "ServiceProvider"
      summary: "Remove a provided service type"
      operationId: "deleteMyService"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceTypeId"
        in: "path"
        required: true
        description: "ID of the service type from the service catalog."
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Deleted"
        "404":
          description: "SERVICE-PROVIDER_404_002 if the caller has no provider; SERVICE-PROVIDER_404_004\
            \ if the provider does not offer this type."
        "409":
          description: "SERVICE_PROVIDER-409-004: only approved providers can remove\
            \ a service."
  /service-provider/{serviceProviderId}/services:
    get:
      tags:
      - "ServiceProvider"
      summary: "Get a service provider's services"
      operationId: "getProviderServices"
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/UserService"
        "404":
          description: "SERVICE-PROVIDER_404_002"
  /me/favorites/service-providers:
    get:
      tags:
      - "Favorite"
      summary: "List my favorite service providers"
      description: "List service providers favorited by the authenticated user"
      operationId: "getMyFavoriteServiceProviders"
      security:
      - bearerAuth: []
      parameters:
      - name: "page"
        in: "query"
        required: false
        schema:
          type: "integer"
          minimum: "0"
      - name: "limit"
        in: "query"
        required: true
        schema:
          type: "integer"
          minimum: "10"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceProviderPaginate"
        "400":
          description: "SERVICE_PROVIDER-400-001"
  /me/favorites/service-providers/{serviceProviderId}:
    post:
      tags:
      - "Favorite"
      summary: "Add service provider to favorites"
      description: "Add a service provider to the authenticated user's favorites"
      operationId: "addServiceProviderToFavorites"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
        "400":
          description: "SERVICE_PROVIDER-400-002"
        "404":
          description: "SERVICE-PROVIDER_404_002"
    delete:
      tags:
      - "Favorite"
      summary: "Remove service provider from favorites"
      description: "Remove a service provider from the authenticated user's favorites"
      operationId: "removeServiceProviderFromFavorites"
      security:
      - bearerAuth: []
      parameters:
      - name: "serviceProviderId"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      responses:
        "204":
          description: "Successful operation"
  /service-catalog:
    get:
      tags:
      - "ServiceType"
      summary: "Get the complete service catalog grouped by categories"
      description: "Get the complete service catalog grouped by categories"
      operationId: "getServiceCatalog"
      responses:
        "200":
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/ServiceCatalogItem"
components:
  schemas:
    ResubmitServiceProviderApplication:
      type: "object"
      required:
      - "phoneNumber"
      - "city"
      - "district"
      - "cniRectoId"
      - "cniVersoId"
      - "profileImageId"
      description: "Only a REJECTED application can be resubmitted. The provider profile\
        \ and identity verification documents are replaced on the same ServiceProvider.\
        \ Existing services and portfolio items are preserved."
      properties:
        city:
          type: "string"
          format: "uuid"
        district:
          type: "string"
          format: "uuid"
        quarter:
          type: "string"
          format: "uuid"
        about:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        cniRectoId:
          type: "string"
          format: "uuid"
        cniVersoId:
          type: "string"
          format: "uuid"
        profileImageId:
          type: "string"
          format: "uuid"
          description: "Used for face verification and becomes public after application\
            \ approval."
    UpdateApprovedServiceProviderProfile:
      type: "object"
      required:
      - "phoneNumber"
      - "city"
      - "district"
      - "profileImageId"
      description: "Updates an APPROVED provider without changing identity verification.\
        \ Provider phone may differ from the user's Keycloak username phone. User\
        \ account details are managed through UAM."
      properties:
        city:
          type: "string"
          format: "uuid"
        district:
          type: "string"
          format: "uuid"
        quarter:
          type: "string"
          format: "uuid"
        about:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        profileImageId:
          type: "string"
          format: "uuid"
    RejectionReason:
      type: "string"
      enum:
      - "NAME_MISMATCH"
      - "CNI_EXPIRED"
      - "CNI_UNREADABLE"
      - "CNI_INVALID"
      - "FACE_MISMATCH"
      - "FACE_UNCLEAR"
      - "PHOTO_UNCLEAR"
      - "DOCUMENT_TAMPERED"
      - "PROFILE_IMAGE_UNCLEAR"
    ServiceProviderRegister:
      required:
      - "phoneNumber"
      - "city"
      - "district"
      - "quarter"
      - "serviceType"
      - "cniRectoId"
      - "cniVersoId"
      - "profileImageId"
      type: "object"
      properties:
        city:
          type: "string"
          format: "uuid"
        district:
          type: "string"
          format: "uuid"
        quarter:
          type: "string"
          format: "uuid"
        about:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        serviceType:
          $ref: "#/components/schemas/ServiceType"
        cniRectoId:
          type: "string"
          format: "uuid"
        cniVersoId:
          type: "string"
          format: "uuid"
        profileImageId:
          type: "string"
          format: "uuid"
          description: "This photo is also used for face verification and will be\
            \ visible on the public profile once approved."
    MyServiceProvider:
      type: "object"
      required:
      - "id"
      - "status"
      - "canEdit"
      - "profileImageReviewStatus"
      - "user"
      properties:
        id:
          type: "string"
          format: "uuid"
        user:
          $ref: "#/components/schemas/UserProfile"
        status:
          $ref: "#/components/schemas/ServiceProviderStatus"
        rejectionReason:
          $ref: "#/components/schemas/RejectionReason"
        canEdit:
          type: "boolean"
        city:
          type: "string"
          format: "uuid"
        district:
          type: "string"
          format: "uuid"
        quarter:
          type: "string"
          format: "uuid"
        about:
          type: "string"
        phoneNumber:
          $ref: "#/components/schemas/PhoneNumber"
        profileImageId:
          type: "string"
          format: "uuid"
        pendingProfileImageId:
          type: "string"
          format: "uuid"
        profileImageReviewStatus:
          $ref: "#/components/schemas/ProfileImageReviewStatus"
        identityVerificationStatus:
          $ref: "#/components/schemas/IdentityVerificationStatus"
        userServices:
          type: "array"
          items:
            $ref: "#/components/schemas/UserService"
    ProfileImageReviewIdentityVerification:
      type: "object"
      description: "Private identity data for authorized admin review."
      properties:
        status:
          $ref: "#/components/schemas/IdentityVerificationStatus"
        cniRectoId:
          type: "string"
          format: "uuid"
        cniVersoId:
          type: "string"
          format: "uuid"
        rejectionReason:
          $ref: "#/components/schemas/RejectionReason"
        verifiedAt:
          type: "string"
          format: "date-time"
        verifiedBy:
          type: "string"
          format: "uuid"
    IdentityVerificationStatus:
      type: "string"
      enum:
