---
server:
  port: 8085
  shutdown: "graceful"
spring:
  application:
    name: "service-provider"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI}"
  datasource:
    url: "jdbc:postgresql://${POSTGRES_HOST:localhost}:${APP_POSTGRES_PORT:5432}/${APP_DB_NAME:uam}"
    username: "${POSTGRES_ADMIN_USER:zlink}"
    password: "${POSTGRES_ADMIN_PASSWORD}"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "validate"
    show-sql: false
  liquibase:
    change-log: "classpath:cm/klg/uam/repository/liquibase/changelog/master.xml"
    enabled: true
  cloud:
    function:
      definition: "user"
    stream:
      bindings:
        user-in-0:
          group: "${spring.application.name}"
          destination: "user"
      kafka:
        binder:
          brokers: "${KAFKA_URL}"
          auto-add-partitions: true
      output-bindings: "user"
jk-dev:
  external-services:
    o-auth2-client-credentials:
      client-credentials:
        token-url: "${TOKEN_URL}"
        client-id: "${CLIENT_ID}"
        client-secret: "${CLIENT_SECRET}"
      scopes:
      - "openid"
    services:
      keycloak:
        uri: "${KEYCLOAK_BASE_URL:http://localhost:8082}"
        realm: "${KEYCLOAK_REALM:z-link}"
  events-messaging:
    enabled: "${DOMAIN_EVENTS_MESSAGING_CONSUMER_ENABLED:true}"
    outbox:
      enabled: "${DOMAIN_EVENTS_MESSAGING_PUBLISHER_ENABLED:false}"
      batchSize: "${SCHEDULER_EVENT_NOTIFICATION_BATCH_SIZE:1000}"
      frequency: "${SCHEDULER_EVENT_NOTIFICATION_FREQUENCY:5000}"
logging:
  level:
    root: "INFO"
    cm.klg.service_provider: "INFO"
    cm: "INFO"
    org.springframework.web: "INFO"
    org.springframework.security: "INFO"
    org.hibernate: "INFO"
